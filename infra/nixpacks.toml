# Build: Python 3.11 backend + Node 20 frontend, one image.
# The API serves the built React bundle from frontend/dist.

[phases.setup]
nixPkgs = ["python311", "nodejs_20", "postgresql_16"]

[phases.install]
cmds = [
  "python -m venv --copies /opt/venv",
  ". /opt/venv/bin/activate && pip install --upgrade pip",
  ". /opt/venv/bin/activate && pip install -r requirements.txt",
  "cd frontend && npm ci",
]

[phases.build]
cmds = [
  "cd frontend && npm run build",
]

[start]
cmd = "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"

[variables]
NIXPACKS_PYTHON_VERSION = "3.11"
NODE_VERSION = "20"
PYTHONUNBUFFERED = "1"